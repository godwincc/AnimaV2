<h2 class="sr-only">Weaving screen with two strand slots, a reagent slot, a weave button, and a result area</h2>
<div style="position:relative;border-radius:16px;overflow:hidden;padding:20px;background:radial-gradient(ellipse at 30% 20%, #4a3a2e 0%, #2b2018 45%, #1a130e 100%)">
<div style="position:relative;z-index:1">
<p style="font-size:16px;font-weight:500;margin:0 0 4px;color:#f0e4d4">Weaving</p>
<p style="font-size:12px;color:#a89680;margin:0 0 16px">Choose two strands to weave a new anima</p>

<div style="display:flex;gap:16px;align-items:center;justify-content:center;margin-bottom:18px">
<div style="flex:0 0 130px;background:rgba(30,22,16,0.75);border:1.5px dashed rgba(201,184,158,0.35);border-radius:12px;padding:14px;text-align:center;cursor:pointer">
<div style="width:100%;aspect-ratio:1;border-radius:8px;background:#c4423a;display:flex;align-items:center;justify-content:center;margin-bottom:8px"><i class="ti ti-photo" style="font-size:24px;color:rgba(255,255,255,0.55)"></i></div>
<p style="font-size:12px;font-weight:500;margin:0;color:#e8cf9a">Ember</p>
<p style="font-size:10px;color:#a89680;margin:2px 0 0">Strand A</p>
</div>
<div style="font-size:20px;color:#e8a03a">+</div>
<div style="flex:0 0 130px;background:rgba(30,22,16,0.5);border:1.5px dashed rgba(201,184,158,0.35);border-radius:12px;padding:14px;text-align:center;cursor:pointer">
<div style="width:100%;aspect-ratio:1;border-radius:8px;background:rgba(201,184,158,0.08);display:flex;align-items:center;justify-content:center;margin-bottom:8px"><i class="ti ti-plus" style="font-size:24px;color:#a89680"></i></div>
<p style="font-size:12px;font-weight:500;margin:0;color:#a89680">Choose anima</p>
<p style="font-size:10px;color:#a89680;margin:2px 0 0">Strand B</p>
</div>
</div>

<div style="display:flex;justify-content:center;margin-bottom:18px">
<div style="background:rgba(30,22,16,0.6);border:1px dashed rgba(201,184,158,0.3);border-radius:10px;padding:8px 14px;text-align:center;cursor:pointer;width:90px">
<div style="width:36px;height:36px;border-radius:50%;background:rgba(232,160,58,0.12);display:flex;align-items:center;justify-content:center;margin:0 auto 4px"><i class="ti ti-plus" style="font-size:16px;color:#e8a03a"></i></div>
<p style="font-size:9px;color:#a89680;margin:0">Reagent</p>
</div>
</div>

<div style="display:flex;justify-content:center;margin-bottom:18px">
<div style="text-align:center;cursor:pointer">
<svg width="110" height="110" viewBox="0 0 260 260">
<defs><radialGradient id="wg" cx="50%" cy="50%" r="50%"><stop offset="0%" stop-color="#f4c979" stop-opacity="0.5"/><stop offset="70%" stop-color="#e8a03a" stop-opacity="0.1"/><stop offset="100%" stop-color="#e8a03a" stop-opacity="0"/></radialGradient></defs>
<circle cx="130" cy="130" r="118" fill="url(#wg)"/>
<circle cx="130" cy="130" r="92" fill="none" stroke="#6a4f2a" stroke-width="1" opacity="0.5"/>
<circle cx="130" cy="130" r="78" fill="none" stroke="#8a6a3a" stroke-width="1.5" opacity="0.5"/>
<circle cx="130" cy="130" r="62" fill="none" stroke="#e8a03a" stroke-width="1.5"/>
<path d="M130 98 L152 130 L130 162 L108 130 Z" fill="#c9862f" stroke="#f4dba8" stroke-width="1.5"/>
<circle cx="130" cy="130" r="8" fill="#fde9b0"/>
</svg>
<p style="font-size:13px;font-weight:500;margin:4px 0 0;color:#f4dba8">Weave</p>
</div>
</div>

<div style="background:rgba(30,22,16,0.75);border:1px solid rgba(201,184,158,0.2);border-radius:12px;padding:14px;text-align:center">
<p style="font-size:11px;color:#a89680;margin:0">Select two strands to see the outcome</p>
</div>
</div>
</div>
